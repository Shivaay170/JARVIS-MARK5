# Project Configuration
settings:
  voice:
    engine: "onnx"
    language: "en-US"

  llm:
    provider: "groq"
    agent_model: "openai/gpt-oss-120b"
    fast_model: "openai/gpt-oss-20b"
    vision_model: "meta-llama/llama-4-scout-17b-16e-instruct"
    reasoning_effort: "low"
    agent_reasoning_effort: "low"
    fast_reasoning_effort: "low"
    # Vision model is not served by Groq: falls back to window-title only.
    vision_enabled: true

  stt:
    provider: "groq"          # groq | local
    model: "whisper-large-v3-turbo"
    local_model: "base.en"    # offline fallback
    language: "en"

  speaker:
    enabled: true
    threshold: 0.6            # cosine similarity for normal commands
    confirm_threshold: 0.7    # stricter for CONFIRM-tier tools
    num_threads: 2

  memory:
    max_context_chars: 1200
    profile_max_tokens: 300
    top_k: 5
    idle_extract_seconds: 120  # session fact extraction after 2 min idle
    profile_rewrite_hours: 24  # profile rewritten at most once per day

  system:
    cpu_limit: 0.05
    ram_limit_mb: 1024

# Reflex layer: pattern -> tool name. Handled without an LLM call.
# Named capture groups (?P<name>...) are passed to the tool as arguments.
reflex_table:
  "^\\s*what('s| is)?\\s*(the\\s*)?time\\b": "get_time"
  "^\\s*time\\b": "get_time"
  "^\\s*what('s| is)?\\s*(the\\s*)?date\\b": "get_date"
  "^\\s*today'?s?\\s*date\\b": "get_date"
  "\\bbattery\\b": "get_system_info"
  "\\b(system status|system info|cpu usage|how much ram)\\b": "get_system_info"
  "^\\s*lock\\s*(the\\s*)?(workstation|computer|pc|system)\\b": "lock_system"
  "^\\s*(set\\s*)?volume\\s*(to\\s*)?(?P<level>\\d{1,3})\\b": "set_volume"
  "^\\s*open\\s+(?P<app_name>[\\w .-]+)$": "open_app"
  "^\\s*clipboard\\b": "clipboard_get"
